[package]
name = "baseball-manager"
version = "0.1.0"
description = "야구 감독 시뮬레이션 데스크톱 게임"
authors = ["Baseball Manager contributors"]
edition = "2021"

[lib]
name = "baseball_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
